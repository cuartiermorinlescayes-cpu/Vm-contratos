name: Actualizar oportunidades

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Actualizar licitaciones y empleos YPF
        run: |
          python scripts/update_opportunities.py
          python scripts/update_jobs.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data.json jobs.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "vm-contratos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json jobs.json
          git commit -m "Actualizar oportunidades y empleos YPF automáticamente"
          git push
