<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>VM Contratos</title><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#111827}header{background:#111827;color:white;padding:18px}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:14px;margin:12px 0}.btn{display:inline-block;background:#2563eb;color:white;padding:10px 12px;border-radius:10px;text-decoration:none}.chip{display:inline-block;background:#eef2ff;padding:5px 8px;border-radius:20px;margin:4px;font-size:13px}.source-chip{display:inline-block;background:#ecfdf5;color:#065f46;padding:5px 8px;border-radius:20px;margin:3px;font-size:12px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px}h1{margin:0}.muted{color:#6b7280}.warn{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;margin-top:8px}.status{font-size:14px;margin:10px 0}.sources{background:white;border:1px solid #ddd;border-radius:12px;padding:10px;margin:10px 0}</style></head><body><header><div class="wrap"><h1>VM Contratos</h1><div>Neuquén · Vaca Muerta · oportunidades verificables</div></div></header><main class="wrap"><h2>Contratos y licitaciones en un solo lugar</h2><p class="muted">Buscá oportunidades y abrí siempre la publicación oficial antes de presentar una oferta.</p><div id="status" class="status muted">Actualizando oportunidades…</div><div id="sources" class="sources"><strong>Fuentes monitoreadas</strong><div id="sourcechips"></div></div><input id="q" placeholder="Buscar limpieza, tecnología, energía, obras..."><div id="cards"></div></main><script>let D=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(d){if(!d)return'Consultar fuente';let x=new Date(d);return Number.isNaN(x.getTime())?esc(d):x.toLocaleString('es-AR')}function render(){let q=document.getElementById('q').value.toLowerCase();let a=D.filter(o=>(o.titulo+' '+o.descripcion+' '+o.rubro+' '+o.organismo+' '+(o.zona||'')+' '+(o.canal||'')).toLowerCase().includes(q));document.getElementById('cards').innerHTML=a.map(o=>`<article class="card"><h3>${esc(o.titulo)}</h3><div><span class="chip">${esc(o.organismo)}</span><span class="chip">${esc(o.rubro)}</span><span class="chip">${esc(o.zona||'Neuquén')}</span><span class="chip">${esc(o.estado)}</span>${o.canal?`<span class="chip">${esc(o.canal)}</span>`:''}</div><p>${esc(o.descripcion)}</p><p class="muted">Apertura: ${fmt(o.apertura)}</p>${o.nota?`<div class="warn">${esc(o.nota)}</div>`:''}<p><a class="btn" target="_blank" rel="noopener" href="${o.fuente}">Fuente oficial</a></p></article>`).join('')||'<p>No hay resultados.</p>'}fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{D=x.opportunities||[];let u=x.updated?new Date(x.updated):null;document.getElementById('status').textContent=`${D.length} oportunidades · ${x.source_count||Object.keys(x.sources||{}).length} fuentes · última actualización ${u&&!Number.isNaN(u.getTime())?u.toLocaleString('es-AR'):'reciente'}${x.automatic_update?` · automática cada ${x.update_frequency_hours||6} h`:''}`;document.getElementById('sourcechips').innerHTML=Object.keys(x.sources||{}).map(s=>`<span class="source-chip">${esc(s)}</span>`).join('');render()}).catch(()=>{document.getElementById('status').textContent='No se pudo comprobar la última actualización. Mostrando datos disponibles.';render()});document.getElementById('q').addEventListener('input',render);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
